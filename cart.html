<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart & Checkout — RS SHOP</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080808">
  <script>if(localStorage.getItem('rs_theme')==='light')document.documentElement.setAttribute('data-theme','light')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .cp-item{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--border)}
    .cp-item:last-child{border:none}
    .cp-item img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--bg4)}
    .cp-info{flex:1;min-width:0}
    .cp-info a{font-weight:600;display:block;line-height:1.3;margin-bottom:4px}
    .cp-info a:hover{color:var(--gold)}
    .cp-line{font-weight:700;color:var(--gold);min-width:84px;text-align:right}
    .stack{display:grid;gap:22px}
    .coupon{display:flex;gap:8px;margin:14px 0}
    .coupon .input{flex:1}
    .pay-detail{margin-top:12px;padding:14px 16px;border:1px dashed var(--gold);border-radius:var(--radius);background:rgba(201,168,76,.06);font-size:.92rem}
    .pay-detail b{color:var(--gold);font-size:1.1rem;letter-spacing:1px}
    .note-free{font-size:.84rem;color:var(--green);margin-top:6px}
    .success{text-align:center;max-width:560px;margin:0 auto;padding:30px 0}
    .success .ok{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:2.4rem;display:grid;place-items:center;margin:0 auto 18px;animation:pop .6s var(--ease)}
    .oid{display:inline-flex;gap:10px;align-items:center;margin:14px 0;padding:12px 22px;border:1px dashed var(--gold);border-radius:var(--radius);font-size:1.4rem;font-weight:700;color:var(--gold);letter-spacing:2px}
    .success .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
    @media(max-width:600px){.cp-item{flex-wrap:wrap}.cp-line{text-align:left}}
  </style>
</head>
<body data-page="cart">

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> / <span>Cart</span></div>
      <h1>🛒 Shopping Cart</h1>
      <p>Order confirm korar age ekbar dekhe nao</p>
    </div>
  </section>

  <section class="section" style="padding-top:36px">
    <div class="container" id="view"></div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="main.js"></script>
<script type="module">
  import { getDeliverySettings, getPaymentSettings, createOrder, COUPONS, PAYMENT_LABELS, PLACEHOLDER_IMG, SHOP, taka, esc, waLink } from "./firebase.js";
  import { Cart, toast } from "./main.js";

  const $ = s => document.querySelector(s);
  const view = $("#view");
  const [DEL, PAY] = await Promise.all([getDeliverySettings(), getPaymentSettings()]);
  const payKeys = Object.keys(PAY).filter(k => PAY[k].on);
  const saved = (() => { try { return JSON.parse(localStorage.getItem("rs_customer")) || {}; } catch { return {}; } })();

  const S = { area: "dhaka", pay: payKeys.includes("cod") ? "cod" : payKeys[0] || "cod", coupon: "", pct: 0, busy: false };
  const money = () => {
    const sub = Cart.subtotal();
    const free = DEL.freeAt && sub >= DEL.freeAt;
    const delivery = free ? 0 : (S.area === "dhaka" ? DEL.dhaka : DEL.outside);
    const discount = Math.round(sub * S.pct / 100);
    return { sub, free, delivery, discount, total: Math.max(0, sub + delivery - discount) };
  };

  function render() {
    const items = Cart.items();
    if (!items.length) {
      view.innerHTML = `<div class="empty"><i class="fas fa-shopping-bag"></i><h3>Tomar cart khali</h3><p>Pochhondo moto product add koro.</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px"><a class="btn btn-primary" href="watches.html">Watches</a><a class="btn btn-outline" href="sunglasses.html">Sunglasses</a><a class="btn btn-outline" href="gift.html">Gifts</a></div></div>`;
      return;
    }
    const keepForm = ["name", "phone", "address", "note", "txn"].reduce((o, k) => (o[k] = $("#f_" + k)?.value ?? saved[k] ?? "", o), {});
    const m = money();
    view.innerHTML = `
    <div class="cart-layout">
      <div class="stack">
        <div class="card"><h3>Cart er product (${Cart.count()})</h3>
          ${items.map(i => `
          <div class="cp-item" data-id="${esc(i.id)}">
            <img src="${esc(i.image || PLACEHOLDER_IMG)}" alt="" onerror="this.src='${PLACEHOLDER_IMG}'">
            <div class="cp-info"><a href="product.html?id=${encodeURIComponent(i.id)}">${esc(i.name)}</a><span style="color:var(--muted)">${taka(i.price)}</span>
              <div style="margin-top:8px"><div class="qty"><button data-q="-1" aria-label="Kom">−</button><span>${i.qty}</span><button data-q="1" aria-label="Bari">+</button></div></div></div>
            <div class="cp-line">${taka(i.price * i.qty)}</div>
            <button class="ci-remove" data-rm aria-label="Remove"><i class="fas fa-trash"></i></button>
          </div>`).join("")}
        </div>

        <div class="card"><h3>Delivery Information</h3>
          <div class="form-row">
            <div class="form-group"><label>Apnar nam *</label><input class="input" id="f_name" value="${esc(keepForm.name)}" placeholder="Pura nam" autocomplete="name"></div>
            <div class="form-group"><label>Mobile number *</label><input class="input" id="f_phone" value="${esc(keepForm.phone)}" placeholder="01XXXXXXXXX" inputmode="numeric" maxlength="11" autocomplete="tel"></div>
          </div>
          <div class="form-group"><label>Delivery area *</label>
            <select class="select" id="f_area"><option value="dhaka" ${S.area === "dhaka" ? "selected" : ""}>Purbadhala / Dhaka (${taka(DEL.dhaka)})</option><option value="outside" ${S.area === "outside" ? "selected" : ""}>Onno jela (${taka(DEL.outside)})</option></select></div>
          <div class="form-group"><label>Puro thikana *</label><textarea class="input" id="f_address" rows="3" placeholder="Bari/road, thana, jela">${esc(keepForm.address)}</textarea></div>
          <div class="form-group" style="margin:0"><label>Note (optional)</label><input class="input" id="f_note" value="${esc(keepForm.note)}" placeholder="Kono bishesh kotha thakle"></div>
        </div>

        <div class="card"><h3>Payment Method</h3>
          <div class="pay-opts">${payKeys.map(k => `
            <label class="pay-opt ${S.pay === k ? "selected" : ""}"><input type="radio" name="pay" value="${k}" ${S.pay === k ? "checked" : ""}>
              <div><b>${PAYMENT_LABELS[k]}</b><small>${k === "cod" ? (PAY.cod.area || "Product hate peye taka din") : "Send Money kore Transaction ID din"}</small></div></label>`).join("")}</div>
          ${S.pay !== "cod" ? `<div class="pay-detail">
            ${PAY[S.pay].number ? `${PAYMENT_LABELS[S.pay]} Personal number: <b>${esc(PAY[S.pay].number)}</b><br>Uporer number e <b style="font-size:inherit">${taka(m.total)}</b> Send Money koro, tarpor Transaction ID niche dao.`
              : `Ei method er number ekhono set kora nei. <a style="color:var(--gold)" href="${waLink()}" target="_blank" rel="noopener">WhatsApp e jogajog koro</a> ba Cash on Delivery nao.`}
            <div class="form-group" style="margin:12px 0 0"><input class="input" id="f_txn" value="${esc(keepForm.txn)}" placeholder="Transaction ID *"></div></div>` : ""}
        </div>
      </div>

      <aside class="card summary">
        <h3>Order Summary</h3>
        <div class="sum-row"><span>Subtotal</span><span>${taka(m.sub)}</span></div>
        <div class="sum-row"><span>Delivery</span><span>${m.free ? "Free" : taka(m.delivery)}</span></div>
        ${m.discount ? `<div class="sum-row" style="color:var(--green)"><span>Coupon (${esc(S.coupon)} · ${S.pct}%)</span><span>− ${taka(m.discount)}</span></div>` : ""}
        <div class="sum-row total"><span>Total</span><span>${taka(m.total)}</span></div>
        ${!m.free && DEL.freeAt ? `<p class="note-free">${taka(DEL.freeAt - m.sub)} aro kinle delivery free!</p>` : ""}
        <div class="coupon"><input class="input" id="f_coupon" placeholder="Coupon code" value="${esc(S.coupon)}"><button class="btn btn-dark btn-sm" id="couponBtn">${S.pct ? "Remove" : "Apply"}</button></div>
        <button class="btn btn-primary btn-block" id="placeBtn" style="padding:15px"><i class="fas fa-check-circle"></i> Place Order · ${taka(m.total)}</button>
        <p style="color:var(--muted);font-size:.82rem;text-align:center;margin-top:12px"><i class="fas fa-lock"></i> Apnar tothyo surakkhito</p>
      </aside>
    </div>`;
  }

  /* cart item buttons */
  view.addEventListener("click", e => {
    const row = e.target.closest(".cp-item");
    if (row) {
      const id = row.dataset.id, q = e.target.closest("[data-q]");
      if (q) { const it = Cart.items().find(i => i.id === id); if (it) Cart.setQty(id, it.qty + +q.dataset.q); }
      if (e.target.closest("[data-rm]")) Cart.remove(id);
      return;
    }
    if (e.target.closest("#couponBtn")) {
      if (S.pct) { S.coupon = ""; S.pct = 0; toast("Coupon soriye newa hoyeche"); return render(); }
      const code = $("#f_coupon").value.trim().toUpperCase();
      if (COUPONS[code]) { S.coupon = code; S.pct = COUPONS[code]; toast(`Coupon lagano hoyeche: ${S.pct}% chhar`); } else toast("Coupon code ta thik na");
      render();
    }
    if (e.target.closest("#placeBtn")) place();
  });
  view.addEventListener("change", e => {
    if (e.target.id === "f_area") { S.area = e.target.value; render(); }
    if (e.target.name === "pay") { S.pay = e.target.value; render(); }
  });
  addEventListener("rs:cart", () => { if (!S.done) render(); });

  /* place order */
  const bad = (id, msg) => { const el = $(id); el.focus(); el.style.borderColor = "var(--red)"; toast(msg); return false; };
  async function place() {
    if (S.busy) return;
    const name = $("#f_name").value.trim(), phone = $("#f_phone").value.trim().replace(/\D/g, ""), address = $("#f_address").value.trim();
    const note = $("#f_note").value.trim(), txn = $("#f_txn")?.value.trim() || "";
    if (name.length < 2) return bad("#f_name", "Apnar nam likhun");
    if (!/^01[3-9]\d{8}$/.test(phone)) return bad("#f_phone", "Sothik 11 digit mobile number din");
    if (address.length < 10) return bad("#f_address", "Puro thikana likhun");
    if (S.pay !== "cod" && txn.length < 5) return bad("#f_txn", "Transaction ID din");

    const btn = $("#placeBtn"); S.busy = true; btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Order hochhe...';
    const m = money(), items = Cart.items();
    try {
      const orderId = await createOrder({
        customer: { name, phone, address, area: S.area === "dhaka" ? "Purbadhala / Dhaka" : "Onno jela" },
        items: items.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty, image: i.image || "", category: i.category || "" })),
        subtotal: m.sub, delivery: m.delivery, discount: m.discount, coupon: S.coupon, total: m.total,
        payment: S.pay, paymentLabel: PAYMENT_LABELS[S.pay], transactionId: S.pay === "cod" ? "" : txn, note
      });
      try { localStorage.setItem("rs_customer", JSON.stringify({ name, phone, address })); } catch {}
      Cart.clear(); S.done = true;
      success(orderId, m, items, name);
    } catch (err) {
      console.error(err); S.busy = false; btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-check-circle"></i> Place Order · ${taka(m.total)}`;
      toast("Order hoyni, abar chesta koro ba WhatsApp e jogajog koro");
    }
  }

  function success(orderId, m, items, name) {
    scrollTo({ top: 0, behavior: "smooth" });
    const lines = items.map(i => `• ${i.name} x${i.qty} = ${taka(i.price * i.qty)}`).join("\n");
    const msg = `Assalamu alaikum, ami RS SHOP e order korechi.\nOrder ID: ${orderId}\n${lines}\nTotal: ${taka(m.total)} (${PAYMENT_LABELS[S.pay]})`;
    view.innerHTML = `
    <div class="success">
      <div class="ok"><i class="fas fa-check"></i></div>
      <h2>Order shofol hoyeche!</h2>
      <p style="color:var(--muted)">Dhonnobad ${esc(name)}! Amra shigroi apnake call kore order confirm korbo.</p>
      <div class="oid"><span id="oidText">${orderId}</span><button class="icon-btn" id="copyBtn" aria-label="Copy"><i class="far fa-copy"></i></button></div>
      <p style="color:var(--muted);font-size:.9rem">Ei Order ID ta shongrokkhon koro. Track korte lagbe.<br>Total: <b style="color:var(--gold)">${taka(m.total)}</b> · ${PAYMENT_LABELS[S.pay]}</p>
      <div class="btns">
        <a class="btn btn-primary" href="track.html?id=${orderId}">Track Order</a>
        <a class="btn btn-wa" href="${waLink(msg)}" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> WhatsApp e janao</a>
        <a class="btn btn-outline" href="index.html">Home</a>
      </div>
    </div>`;
    $("#copyBtn").addEventListener("click", () => { navigator.clipboard?.writeText(orderId); toast("Order ID copy hoyeche"); });
  }

  render();
</script>
</body>
</html>
