<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunglasses — RS SHOP</title>
  <meta name="description" content="Stylish polarized and premium sunglasses for men, women and kids at the best price in Bangladesh. Cash on Delivery available. RS SHOP Purbadhala.">
  <meta name="theme-color" content="#080808">
  <script>if(localStorage.getItem('rs_theme')==='light')document.documentElement.setAttribute('data-theme','light')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="sunglasses">

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> / <span>Sunglasses</span></div>
      <h1>🕶️ Stylish Sunglasses</h1>
      <p>Polarized & premium shades</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="filter-bar">
        <div class="tabs" id="genderTabs">
          <button class="tab active" data-g="">All</button>
          <button class="tab" data-g="men">Men</button>
          <button class="tab" data-g="women">Women</button>
          <button class="tab" data-g="kids">Kids</button>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <select class="select" id="subSelect"><option value="">All Types</option></select>
          <select class="select" id="sortSelect">
            <option value="new">Newest</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
            <option value="off">Biggest Discount</option>
          </select>
        </div>
      </div>
      <p class="result-count" id="count" style="margin-bottom:16px"></p>
      <div class="product-grid" id="grid"></div>
      <div style="text-align:center;margin-top:34px"><button class="btn btn-outline hidden" id="moreBtn">Load More</button></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="main.js"></script>
<script type="module">
  import { getProducts, getFlashSale, applyFlash, discountPercent, SUBCATS } from "./firebase.js";
  import { productCard, skeletons } from "./main.js";

  /* ── ei line ta change korlei sunglasses/gift page hoy ── */
  const CATEGORY = "sunglasses";
  const PAGE = 12;

  const $ = s => document.querySelector(s);
  const url = new URL(location.href);
  const state = { gender: url.searchParams.get("gender") || "", sub: "", sort: "new", shown: PAGE };
  let list = [];

  $("#grid").innerHTML = skeletons(8);
  const [all, flash] = await Promise.all([getProducts({ category: CATEGORY }).catch(() => []), getFlashSale()]);
  list = all.map(p => applyFlash(p, flash));

  /* type dropdown: jei type er product ache shudhu sheta */
  const subs = [...new Set(list.map(p => p.subCategory).filter(Boolean))];
  $("#subSelect").innerHTML = `<option value="">All Types</option>` + subs.map(s => `<option value="${s}">${SUBCATS[s] || s}</option>`).join("");
  if (subs.length < 1) $("#subSelect").classList.add("hidden");

  function render() {
    let r = list.filter(p => (!state.gender || p.gender === state.gender) && (!state.sub || p.subCategory === state.sub));
    if (state.sort === "low")  r.sort((a, b) => a.price - b.price);
    if (state.sort === "high") r.sort((a, b) => b.price - a.price);
    if (state.sort === "off")  r.sort((a, b) => discountPercent(b.price, b.oldPrice) - discountPercent(a.price, a.oldPrice));
    $("#count").textContent = r.length ? `${r.length} ta product` : "";
    $("#grid").innerHTML = r.length
      ? r.slice(0, state.shown).map(productCard).join("")
      : `<div class="empty" style="grid-column:1/-1"><i class="fas fa-box-open"></i><h3>Kono product paoa jayni</h3><p>Onno filter diye dekho, ba shigroi notun product ashche.</p></div>`;
    $("#moreBtn").classList.toggle("hidden", r.length <= state.shown);
    document.querySelectorAll("#genderTabs .tab").forEach(t => t.classList.toggle("active", t.dataset.g === state.gender));
    const u = new URL(location.href);
    state.gender ? u.searchParams.set("gender", state.gender) : u.searchParams.delete("gender");
    history.replaceState(null, "", u);
  }

  $("#genderTabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (!b) return; state.gender = b.dataset.g; state.shown = PAGE; render(); });
  $("#subSelect").addEventListener("change", e => { state.sub = e.target.value; state.shown = PAGE; render(); });
  $("#sortSelect").addEventListener("change", e => { state.sort = e.target.value; state.shown = PAGE; render(); });
  $("#moreBtn").addEventListener("click", () => { state.shown += PAGE; render(); });
  render();
</script>
</body>
</html>
