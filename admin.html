<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — RS SHOP</title>
  <meta name="robots" content="noindex,nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body{overflow:auto}
    #login{min-height:100vh;display:grid;place-items:center;padding:20px}
    #login .card{width:100%;max-width:400px}
    #app{display:none;min-height:100vh}
    .side{position:fixed;top:0;bottom:0;left:0;width:240px;background:var(--bg2);border-right:1px solid var(--border);padding:18px 12px;overflow:auto;z-index:50;transition:transform .3s}
    .side .logo{display:block;text-align:center;margin-bottom:18px}
    .side button{display:flex;gap:12px;align-items:center;width:100%;padding:11px 14px;border-radius:8px;color:var(--muted);text-align:left;transition:.2s}
    .side button:hover,.side button.on{background:var(--bg4);color:var(--gold)}
    .side button i{width:18px;text-align:center}
    .side hr{border:none;border-top:1px solid var(--border);margin:10px 0}
    .top{display:none;position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;align-items:center;gap:12px}
    #main{margin-left:240px;padding:28px;max-width:1100px}
    #main h2{font-family:'Cinzel','Hind Siliguri',serif;margin-bottom:18px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
    .stat{padding:18px;background:var(--bg3);border:1px solid var(--border);border-radius:12px}
    .stat b{display:block;font-size:1.7rem;color:var(--gold)}.stat span{color:var(--muted);font-size:.88rem}
    .row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
    .row:last-child{border:none}.row img{width:54px;height:54px;object-fit:cover;border-radius:8px;background:var(--bg4)}
    .grow{flex:1;min-width:0}.grow small{display:block;color:var(--muted)}
    .acts{display:flex;gap:6px;flex-wrap:wrap}
    .pill{padding:3px 12px;border-radius:50px;font-size:.78rem;background:rgba(201,168,76,.15);color:var(--gold)}
    .pill.delivered,.pill.ok{background:rgba(37,211,102,.15);color:var(--green)}.pill.cancelled,.pill.bad{background:rgba(230,57,70,.15);color:var(--red)}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
    .chk{display:flex;align-items:center;gap:10px;margin:0 0 14px;cursor:pointer}.chk input{accent-color:var(--gold);width:18px;height:18px}
    details{border:1px solid var(--border);border-radius:12px;background:var(--bg3);margin-bottom:12px;padding:0 16px}
    summary{cursor:pointer;padding:14px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;list-style:none}
    summary::-webkit-details-marker{display:none}
    .det{padding:0 0 16px;border-top:1px solid var(--border);padding-top:12px;color:var(--muted);font-size:.92rem}
    #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--gold);padding:11px 22px;border-radius:50px;z-index:99;opacity:0;pointer-events:none;transition:.3s}
    #toast.show{opacity:1}
    @media(max-width:860px){.side{transform:translateX(-100%)}.side.open{transform:none}.top{display:flex}#main{margin-left:0;padding:18px}.stats{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div id="login">
  <div class="card">
    <div class="logo" style="text-align:center;font-size:2rem;margin-bottom:6px">RS<small>SHOP</small></div>
    <p style="text-align:center;color:var(--muted);margin-bottom:20px">Admin Login</p>
    <div class="form-group"><label>Email</label><input class="input" id="lEmail" type="email" autocomplete="username"></div>
    <div class="form-group"><label>Password</label><input class="input" id="lPass" type="password" autocomplete="current-password"></div>
    <p class="error-text" id="lErr"></p>
    <button class="btn btn-primary btn-block" id="lBtn">Login</button>
  </div>
</div>

<div id="app">
  <div class="top"><button class="icon-btn" id="burger"><i class="fas fa-bars"></i></button><b class="logo" style="font-size:1.2rem">RS ADMIN</b></div>
  <aside class="side" id="side">
    <a class="logo" href="index.html" target="_blank">RS<small>ADMIN</small></a>
    <button data-go="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</button>
    <button data-go="orders"><i class="fas fa-receipt"></i> Orders</button>
    <button data-go="product"><i class="fas fa-plus-circle"></i> Add Product</button>
    <button data-go="products"><i class="fas fa-box"></i> Products</button>
    <button data-go="flash"><i class="fas fa-bolt"></i> Flash Sale</button>
    <button data-go="messages"><i class="fas fa-envelope"></i> Messages</button>
    <button data-go="banners"><i class="fas fa-image"></i> Banners</button>
    <hr>
    <button data-go="shop"><i class="fas fa-store"></i> Shop Settings</button>
    <button data-go="payment"><i class="fas fa-wallet"></i> Payment</button>
    <button data-go="delivery"><i class="fas fa-truck"></i> Delivery</button>
    <button data-go="password"><i class="fas fa-key"></i> Password</button>
    <hr>
    <button id="logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script type="module">
import { db, collection, doc, getDocs, getDoc, addDoc, setDoc, updateDoc, deleteDoc, serverTimestamp,
         adminLogin, adminLogout, onAdmin, changeAdminPassword,
         CATEGORIES, GENDERS, SUBCATS, STATUS, PAYMENT_LABELS, PLACEHOLDER_IMG, taka, esc } from "./firebase.js";

const $ = (s, r = document) => r.querySelector(s);
const main = $("#main");
const say = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2400); };
const all = async c => (await getDocs(collection(db, c))).docs.map(d => ({ id: d.id, ...d.data() }));
const ms = x => x?.toMillis ? x.toMillis() : 0;
const dt = x => x?.toDate ? x.toDate().toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
const opts = (obj, sel) => Object.entries(obj).map(([k, v]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${typeof v === "string" ? v : v.label}</option>`).join("");
const fld = (l, id, v = "", type = "text", ph = "") => `<div class="form-group"><label>${l}</label><input class="input" id="${id}" type="${type}" value="${esc(v)}" placeholder="${ph}"></div>`;
const chk = (l, id, on) => `<label class="chk"><input type="checkbox" id="${id}" ${on ? "checked" : ""}> ${l}</label>`;
const val = id => $("#" + id).value.trim();

/* ── LOGIN ── */
$("#lBtn").onclick = async () => {
  $("#lErr").textContent = "";
  try { await adminLogin($("#lEmail").value, $("#lPass").value); }
  catch (e) { $("#lErr").textContent = e.message === "not-admin" ? "Ei account admin na." : "Email ba password thik na."; }
};
$("#lPass").onkeydown = e => e.key === "Enter" && $("#lBtn").click();
$("#logout").onclick = () => adminLogout();
$("#burger").onclick = () => $("#side").classList.toggle("open");
onAdmin(u => { $("#login").style.display = u ? "none" : "grid"; $("#app").style.display = u ? "block" : "none"; if (u) go("dashboard"); });

/* ── NAV ── */
const P = {};
async function go(name, arg) {
  document.querySelectorAll(".side [data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === (name === "editproduct" ? "product" : name)));
  $("#side").classList.remove("open");
  main.innerHTML = '<p style="color:var(--muted)"><i class="fas fa-spinner fa-spin"></i> Loading...</p>';
  try { await P[name](arg); } catch (e) { console.error(e); main.innerHTML = `<div class="card"><h3>Error</h3><p class="error-text">${esc(e.code || e.message)}</p><p style="color:var(--muted)">Firestore Rules ba login check koro.</p></div>`; }
  scrollTo(0, 0);
}
document.querySelector(".side").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

/* ── DASHBOARD ── */
P.dashboard = async () => {
  const [o, p, m] = await Promise.all([all("orders"), all("products"), all("messages")]);
  o.sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
  const rev = o.filter(x => x.status === "delivered").reduce((s, x) => s + (x.total || 0), 0);
  main.innerHTML = `<h2>Dashboard</h2>
  <div class="stats"><div class="stat"><b>${o.length}</b><span>Total Orders</span></div><div class="stat"><b>${o.filter(x => x.status === "pending").length}</b><span>New (Pending)</span></div>
  <div class="stat"><b>${taka(rev)}</b><span>Delivered Revenue</span></div><div class="stat"><b>${p.length}</b><span>Products</span></div></div>
  <div class="card"><h3>Recent Orders ${m.filter(x => x.status === "unread").length ? `<span class="pill bad">${m.filter(x => x.status === "unread").length} new message</span>` : ""}</h3>
  ${o.slice(0, 6).map(x => `<div class="row"><div class="grow"><b>${esc(x.orderId || x.id)}</b><small>${esc(x.customer?.name)} · ${dt(x.createdAt)}</small></div><b style="color:var(--gold)">${taka(x.total)}</b><span class="pill ${esc(x.status)}">${STATUS[x.status]?.label || x.status}</span></div>`).join("") || '<p style="color:var(--muted)">Ekhono kono order nei</p>'}</div>`;
};

/* ── ORDERS ── */
P.orders = async (filter = "") => {
  let o = await all("orders"); o.sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
  if (filter) o = o.filter(x => x.status === filter);
  main.innerHTML = `<h2>Orders (${o.length})</h2>
  <select class="select" id="of" style="max-width:220px;margin-bottom:16px"><option value="">All status</option>${opts(STATUS, filter)}</select>
  ${o.map(x => `<details><summary><b>${esc(x.orderId || x.id)}</b><span class="grow">${esc(x.customer?.name)} · ${esc(x.customer?.phone)}</span><b style="color:var(--gold)">${taka(x.total)}</b><span class="pill ${esc(x.status)}">${STATUS[x.status]?.label || x.status}</span></summary>
    <div class="det"><p>${dt(x.createdAt)} · ${esc(x.paymentLabel || PAYMENT_LABELS[x.payment] || "")}${x.transactionId ? " · Txn: " + esc(x.transactionId) : ""}${x.coupon ? " · Coupon: " + esc(x.coupon) : ""}</p>
    <p><i class="fas fa-map-marker-alt"></i> ${esc(x.customer?.address)} (${esc(x.customer?.area)})</p>${x.note ? `<p>Note: ${esc(x.note)}</p>` : ""}
    ${(x.items || []).map(i => `<div class="row"><img src="${esc(i.image || PLACEHOLDER_IMG)}" alt=""><div class="grow">${esc(i.name)}<small>${taka(i.price)} × ${i.qty}</small></div><b>${taka(i.price * i.qty)}</b></div>`).join("")}
    <p style="margin-top:10px">Subtotal ${taka(x.subtotal)} · Delivery ${taka(x.delivery)} · Discount ${taka(x.discount || 0)} · <b style="color:var(--gold)">Total ${taka(x.total)}</b></p>
    <div class="acts" style="margin-top:10px"><select class="select" style="width:auto" data-st="${x.id}">${opts(STATUS, x.status)}</select>
    <a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="https://wa.me/88${esc(x.customer?.phone)}"><i class="fab fa-whatsapp"></i></a>
    <button class="btn btn-dark btn-sm" data-del="${x.id}"><i class="fas fa-trash"></i></button></div></div></details>`).join("") || '<div class="empty"><i class="fas fa-receipt"></i><h3>Kono order nei</h3></div>'}`;
  $("#of").onchange = e => P.orders(e.target.value);
  main.querySelectorAll("[data-st]").forEach(s => s.onchange = async () => { await updateDoc(doc(db, "orders", s.dataset.st), { status: s.value }); say("Status update hoyeche"); });
  main.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (confirm("Order ta muchhben?")) { await deleteDoc(doc(db, "orders", b.dataset.del)); P.orders(filter); } });
};

/* ── PRODUCT FORM (add + edit) ── */
P.product = async () => P.editproduct(null);
P.editproduct = async id => {
  const p = id ? (await getDoc(doc(db, "products", id))).data() || {} : {};
  main.innerHTML = `<h2>${id ? "Edit Product" : "Add Product"}</h2><div class="card">
  ${fld("Product er nam *", "pName", p.name)}
  <div class="g2"><div class="form-group"><label>Category *</label><select class="select" id="pCat">${opts(CATEGORIES, p.category)}</select></div>
  <div class="form-group"><label>Gender</label><select class="select" id="pGen">${opts(GENDERS, p.gender)}</select></div>
  <div class="form-group"><label>Type</label><select class="select" id="pSub"><option value="">— nai —</option>${opts(SUBCATS, p.subCategory)}</select></div>
  <div class="form-group"><label>Stock</label><select class="select" id="pStock">${opts({ in_stock: "In Stock", limited: "Limited", out_of_stock: "Stock Out" }, p.stock || "in_stock")}</select></div>
  ${fld("Dam (৳) *", "pPrice", p.price, "number")}${fld("Purano dam (৳)", "pOld", p.oldPrice || "", "number")}${fld("Stock quantity", "pQty", p.stockQty ?? "", "number")}</div>
  ${fld("Image URL *", "pImg", p.imageUrl, "url", "https://...")}
  <img id="pPrev" src="${esc(p.imageUrl || PLACEHOLDER_IMG)}" style="width:110px;height:110px;object-fit:cover;border-radius:10px;margin:-6px 0 14px" onerror="this.src='${PLACEHOLDER_IMG}'">
  <div class="form-group"><label>Description</label><textarea class="input" id="pDesc" rows="4">${esc(p.description || "")}</textarea></div>
  ${chk("⭐ Featured (home page e age dekhabe)", "pFeat", p.featured)}${chk("⚡ Flash Sale e rakho", "pFlash", p.flashSale)}
  <button class="btn btn-primary" id="pSave"><i class="fas fa-save"></i> ${id ? "Update" : "Save Product"}</button></div>`;
  $("#pImg").oninput = e => $("#pPrev").src = e.target.value || PLACEHOLDER_IMG;
  $("#pSave").onclick = async () => {
    const d = { name: val("pName"), category: val("pCat"), gender: val("pGen"), subCategory: val("pSub"), stock: val("pStock"),
      price: +val("pPrice"), oldPrice: +val("pOld") || 0, stockQty: +val("pQty") || 0, imageUrl: val("pImg"), description: val("pDesc"),
      featured: $("#pFeat").checked, flashSale: $("#pFlash").checked };
    if (!d.name || !(d.price > 0) || !d.imageUrl) return say("Nam, dam ar image URL dao");
    if (id) await updateDoc(doc(db, "products", id), d); else await addDoc(collection(db, "products"), { ...d, createdAt: serverTimestamp() });
    say("Product save hoyeche ✓"); go("products");
  };
};

/* ── PRODUCTS LIST ── */
P.products = async () => {
  const l = (await all("products")).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
  main.innerHTML = `<h2>Products (${l.length})</h2><div class="card">${l.map(p => `
  <div class="row"><img src="${esc(p.imageUrl || PLACEHOLDER_IMG)}" alt="" onerror="this.src='${PLACEHOLDER_IMG}'"><div class="grow"><b>${esc(p.name)}</b><small>${esc(CATEGORIES[p.category]?.label || p.category)} · ${esc(p.gender || "")} · ${taka(p.price)} ${p.featured ? "· ⭐" : ""} ${p.flashSale ? "· ⚡" : ""}</small></div>
  <span class="pill ${p.stock === "out_of_stock" ? "bad" : "ok"}">${p.stock === "out_of_stock" ? "Stock Out" : p.stock === "limited" ? "Limited" : "In Stock"}</span>
  <div class="acts"><button class="btn btn-dark btn-sm" data-e="${p.id}"><i class="fas fa-pen"></i></button><button class="btn btn-dark btn-sm" data-d="${p.id}"><i class="fas fa-trash"></i></button></div></div>`).join("") || '<div class="empty"><i class="fas fa-box"></i><h3>Ekhono product nei</h3><p>"Add Product" theke prothom product dao.</p></div>'}</div>`;
  main.querySelectorAll("[data-e]").forEach(b => b.onclick = () => go("editproduct", b.dataset.e));
  main.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { if (confirm("Product ta muchhben?")) { await deleteDoc(doc(db, "products", b.dataset.d)); P.products(); } });
};

/* ── MESSAGES ── */
P.messages = async () => {
  const l = (await all("messages")).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
  main.innerHTML = `<h2>Messages (${l.length})</h2>${l.map(m => `<details ${m.status === "unread" ? "open" : ""}><summary><b>${esc(m.name)}</b><span class="grow">${esc(m.subject)} · ${dt(m.createdAt)}</span>${m.status === "unread" ? '<span class="pill bad">New</span>' : ""}</summary>
  <div class="det"><p style="color:var(--text);white-space:pre-line">${esc(m.message)}</p><p>${esc(m.phone)} ${m.email ? "· " + esc(m.email) : ""} ${m.orderId ? "· Order: " + esc(m.orderId) : ""}</p>
  <div class="acts"><a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="https://wa.me/88${esc(m.phone)}"><i class="fab fa-whatsapp"></i> Reply</a>
  <button class="btn btn-dark btn-sm" data-r="${m.id}">Read</button><button class="btn btn-dark btn-sm" data-d="${m.id}"><i class="fas fa-trash"></i></button></div></div></details>`).join("") || '<div class="empty"><i class="fas fa-envelope"></i><h3>Kono message nei</h3></div>'}`;
  main.querySelectorAll("[data-r]").forEach(b => b.onclick = async () => { await updateDoc(doc(db, "messages", b.dataset.r), { status: "read" }); P.messages(); });
  main.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { if (confirm("Muchhben?")) { await deleteDoc(doc(db, "messages", b.dataset.d)); P.messages(); } });
};

/* ── BANNERS ── */
P.banners = async () => {
  const l = (await all("banners")).sort((a, b) => (a.order || 0) - (b.order || 0));
  main.innerHTML = `<h2>Banners</h2><div class="card" style="margin-bottom:20px"><h3>Notun Banner</h3>
  ${fld("Image URL * (boro, 21:8 ratio bhalo)", "bImg", "", "url", "https://...")}<div class="g2">${fld("Serial (1, 2, 3...)", "bOrd", l.length + 1, "number")}
  <label class="chk" style="align-self:end"><input type="checkbox" id="bAct" checked> Active</label></div><button class="btn btn-primary" id="bSave"><i class="fas fa-plus"></i> Add Banner</button></div>
  <div class="card">${l.map(b => `<div class="row"><img src="${esc(b.imageUrl)}" style="width:120px;height:56px" alt=""><div class="grow">Serial ${b.order || 0}<small>${b.active === false ? "Off" : "Active"}</small></div>
  <div class="acts"><button class="btn btn-dark btn-sm" data-t="${b.id}" data-a="${b.active === false}">${b.active === false ? "On koro" : "Off koro"}</button><button class="btn btn-dark btn-sm" data-d="${b.id}"><i class="fas fa-trash"></i></button></div></div>`).join("") || '<p style="color:var(--muted)">Kono banner nei, default slide dekhacche.</p>'}</div>`;
  $("#bSave").onclick = async () => { if (!val("bImg")) return say("Image URL dao"); await addDoc(collection(db, "banners"), { imageUrl: val("bImg"), order: +val("bOrd") || 1, active: $("#bAct").checked, createdAt: serverTimestamp() }); say("Banner add hoyeche ✓"); P.banners(); };
  main.querySelectorAll("[data-t]").forEach(b => b.onclick = async () => { await updateDoc(doc(db, "banners", b.dataset.t), { active: b.dataset.a === "true" }); P.banners(); });
  main.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { if (confirm("Muchhben?")) { await deleteDoc(doc(db, "banners", b.dataset.d)); P.banners(); } });
};

/* ── SETTINGS (shop / flash / payment / delivery) ── */
const SET = {
  shop: ["Shop Settings", [["name", "Shop er nam"], ["phone", "Phone"], ["whatsapp", "WhatsApp (88 diye, jemon 8801XXXXXXXXX)"], ["facebook", "Facebook link", "url"], ["address", "Address"]]],
  flash: ["Flash Sale", [["title", "Title (jemon Eid Flash Sale)"], ["discount", "Discount % (product er dam theke kombe)", "number"], ["startDate", "Shuru", "datetime-local"], ["endDate", "Shesh", "datetime-local"], ["active", "Flash Sale cholchhe", "check"]]],
  payment: ["Payment", [["payCOD", "Cash on Delivery on", "check"], ["codArea", "Cash on Delivery note"], ["payBkash", "bKash on", "check"], ["bkashNum", "bKash number"], ["payNagad", "Nagad on", "check"], ["nagadNum", "Nagad number"], ["payRocket", "Rocket on", "check"], ["rocketNum", "Rocket number"]]],
  delivery: ["Delivery Charge", [["dhaka", "Purbadhala / Dhaka (৳)", "number"], ["outside", "Onno jela (৳)", "number"], ["freeAt", "Eto taka er upore free delivery (৳, 0 = off)", "number"]]]
};
Object.entries(SET).forEach(([key, [title, fields]]) => P[key] = async () => {
  const s = (await getDoc(doc(db, "settings", key))).data() || {};
  main.innerHTML = `<h2>${title}</h2><div class="card">${fields.map(([k, l, t]) => t === "check" ? chk(l, "s_" + k, s[k] ?? (key === "payment")) : fld(l, "s_" + k, s[k] ?? "", t || "text")).join("")}
  <button class="btn btn-primary" id="sSave"><i class="fas fa-save"></i> Save</button></div>`;
  $("#sSave").onclick = async () => {
    const d = {}; fields.forEach(([k, , t]) => d[k] = t === "check" ? $("#s_" + k).checked : t === "number" ? +val("s_" + k) || 0 : val("s_" + k));
    await setDoc(doc(db, "settings", key), d, { merge: true }); say("Save hoyeche ✓");
  };
});

/* ── PASSWORD ── */
P.password = async () => {
  main.innerHTML = `<h2>Password Change</h2><div class="card" style="max-width:460px">${fld("Ager password", "pw0", "", "password")}${fld("Notun password (min 8)", "pw1", "", "password")}${fld("Notun password abar", "pw2", "", "password")}<p class="error-text" id="pwErr"></p><button class="btn btn-primary" id="pwBtn">Change Password</button></div>`;
  $("#pwBtn").onclick = async () => {
    const e = $("#pwErr"); e.textContent = "";
    if (val("pw1").length < 8) return e.textContent = "Notun password komopokkhe 8 character";
    if (val("pw1") !== val("pw2")) return e.textContent = "Duto password mile ni";
    try { await changeAdminPassword($("#pw0").value, $("#pw1").value); say("Password change hoyeche ✓"); ["pw0", "pw1", "pw2"].forEach(i => $("#" + i).value = ""); }
    catch { e.textContent = "Ager password thik na."; }
  };
};
</script>
