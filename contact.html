<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — RS SHOP</title>
  <meta name="description" content="RS SHOP Purbadhala — Station Road, Kazi Super Market. Call, WhatsApp ba message pathao.">
  <meta name="theme-color" content="#080808">
  <script>if(localStorage.getItem('rs_theme')==='light')document.documentElement.setAttribute('data-theme','light')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .c-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:start}
    .c-card{display:flex;gap:16px;align-items:center;padding:18px 20px;background:var(--bg3);border:1px solid var(--border);border-radius:14px;transition:transform .35s var(--ease),border-color .3s}
    .c-card:hover{transform:translateX(6px);border-color:var(--gold)}
    .c-card .ic{width:48px;height:48px;border-radius:50%;background:rgba(201,168,76,.12);color:var(--gold);display:grid;place-items:center;font-size:1.15rem;flex-shrink:0}
    .c-card small{display:block;color:var(--muted)}
    .c-card b{display:block;line-height:1.35}
    .c-list{display:grid;gap:14px}
    .map{margin-top:40px;border:1px solid var(--border);border-radius:16px;overflow:hidden}
    .map iframe{width:100%;height:380px;border:0;display:block}
    .hp{position:absolute;left:-9999px;opacity:0}
    .sent{text-align:center;padding:30px 10px}
    .sent .ok{width:76px;height:76px;border-radius:50%;background:var(--green);color:#fff;font-size:2rem;display:grid;place-items:center;margin:0 auto 14px;animation:pop .6s var(--ease)}
    @media(max-width:820px){.c-grid{grid-template-columns:1fr}.map iframe{height:300px}}
  </style>
</head>
<body data-page="contact">

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="crumbs"><a href="index.html">Home</a> / <span>Contact</span></div>
      <h1>📞 Contact Us</h1>
      <p>Kono proshno ba shahajjo lagle amader jaanao</p>
    </div>
  </section>

  <section class="section" style="padding-top:40px">
    <div class="container">
      <div class="c-grid">
        <div class="c-list">
          <a class="c-card" id="cAddr" target="_blank" rel="noopener"><div class="ic"><i class="fas fa-map-marker-alt"></i></div><div><small>Shop Address</small><b id="tAddr"></b></div></a>
          <a class="c-card" id="cPhone"><div class="ic"><i class="fas fa-phone"></i></div><div><small>Call Us</small><b id="tPhone"></b></div></a>
          <a class="c-card" id="cWa" target="_blank" rel="noopener"><div class="ic"><i class="fab fa-whatsapp"></i></div><div><small>WhatsApp</small><b>Message pathao</b></div></a>
          <a class="c-card" id="cFb" target="_blank" rel="noopener"><div class="ic"><i class="fab fa-facebook-f"></i></div><div><small>Facebook</small><b>RS SHOP page</b></div></a>
        </div>

        <div class="card" id="formCard">
          <h3>Amader message pathao</h3>
          <div id="formBox">
            <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="form-row">
              <div class="form-group"><label>Apnar nam *</label><input class="input" id="name" autocomplete="name"></div>
              <div class="form-group"><label>Mobile number *</label><input class="input" id="phone" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX" autocomplete="tel"></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label>Email (optional)</label><input class="input" id="email" type="email" autocomplete="email"></div>
              <div class="form-group"><label>Bishoy</label>
                <select class="select" id="subject"><option>Product niye proshno</option><option>Order niye shahajjo</option><option>Delivery / Return</option><option>Obhijog / Poramorsho</option><option>Onno</option></select></div>
            </div>
            <div class="form-group"><label>Order ID (jodi thake)</label><input class="input" id="orderId" placeholder="RSXXXXXXXXX" style="text-transform:uppercase"></div>
            <div class="form-group"><label>Apnar message *</label><textarea class="input" id="message" rows="5"></textarea></div>
            <p class="error-text" id="err"></p>
            <button class="btn btn-primary btn-block" id="sendBtn"><i class="fas fa-paper-plane"></i> Message Pathao</button>
          </div>
        </div>
      </div>

      <div class="map">
        <iframe id="mapFrame" title="RS SHOP location" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
      <div style="text-align:center;margin-top:16px"><a class="btn btn-outline" id="dirBtn" target="_blank" rel="noopener"><i class="fas fa-location-arrow"></i> Get Directions</a></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script type="module" src="main.js"></script>
<script type="module">
  import { SHOP, getShopInfo, sendMessage, waLink, esc } from "./firebase.js";

  const $ = s => document.querySelector(s);

  /* shop info (admin Settings theke override hoy) */
  const info = await getShopInfo().catch(() => SHOP);
  $("#tAddr").textContent = info.address;
  $("#cAddr").href = SHOP.mapLink;
  $("#tPhone").textContent = info.phone;
  $("#cPhone").href = "tel:" + info.phone;
  $("#cWa").href = waLink("Assalamu alaikum, ami RS SHOP theke kichu jante chai");
  $("#cFb").href = info.facebook;
  $("#mapFrame").src = SHOP.mapEmbed;
  $("#dirBtn").href = SHOP.mapLink;

  /* prefill */
  try { const c = JSON.parse(localStorage.getItem("rs_customer")) || {}; $("#name").value = c.name || ""; $("#phone").value = c.phone || ""; } catch {}
  const oid = new URLSearchParams(location.search).get("order"); if (oid) $("#orderId").value = oid.toUpperCase();

  async function send() {
    const err = $("#err"); err.textContent = "";
    if ($("#hp").value) return;                                   /* bot */
    const last = +localStorage.getItem("rs_last_msg") || 0;
    if (Date.now() - last < 30000) return err.textContent = "Ektu opekkha kore abar pathao.";
    const m = { name: $("#name").value.trim(), phone: $("#phone").value.trim().replace(/\D/g, ""), email: $("#email").value.trim(),
                subject: $("#subject").value, orderId: $("#orderId").value.trim().toUpperCase(), message: $("#message").value.trim() };
    if (m.name.length < 2) return err.textContent = "Apnar nam likhun";
    if (!/^01[3-9]\d{8}$/.test(m.phone)) return err.textContent = "Sothik 11 digit mobile number din";
    if (m.email && !/^\S+@\S+\.\S+$/.test(m.email)) return err.textContent = "Email ta thik na";
    if (m.message.length < 5) return err.textContent = "Message likhun";

    const btn = $("#sendBtn"); btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Pathachchi...';
    try {
      const ref = await sendMessage(m);
      localStorage.setItem("rs_last_msg", Date.now());
      $("#formBox").innerHTML = `<div class="sent"><div class="ok"><i class="fas fa-check"></i></div><h3>Message pathano hoyeche!</h3>
        <p style="color:var(--muted)">Dhonnobad ${esc(m.name)}. Amra shigroi apnar shathe jogajog korbo.</p>
        <p style="margin-top:10px">Reference: <b style="color:var(--gold)">${ref}</b></p></div>`;
    } catch (e) {
      console.error(e); err.textContent = "Message pathano jayni. WhatsApp e jogajog koro.";
      btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Message Pathao';
    }
  }
  $("#sendBtn").addEventListener("click", send);
</script>
</body>
</html>
